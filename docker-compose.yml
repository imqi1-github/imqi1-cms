services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imqi1-nodejs:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${PORT_PROD:-3000}:3000"
    environment:
      # 覆盖 .env 中的连接目标，指向 compose 内的服务名
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST_PROD: redis
      REDIS_PORT_PROD: "6379"
    env_file:
      - .env
    volumes:
      # 用户上传文件持久化（应用运行时写入）
      - uploads:/app/.output/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: imqi1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-imqi1}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库自动初始化：MySQL 官方镜像会在「数据目录为空」（即首次创建）时，
      # 自动按文件名顺序执行 /docker-entrypoint-initdb.d/ 下的 .sql，且默认库为
      # MYSQL_DATABASE（DB_NAME）。init-db.sql 只建表/插数据、不含库名，正好导入该库。
      # 因此首次 `docker compose up` 即完成建表 + 默认设置 + 示例数据，无需再手动初始化。
      # 注意：仅当 mysql-data 卷为空时才会执行；卷已有数据则跳过（不会覆盖已有数据）。
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  uploads:
