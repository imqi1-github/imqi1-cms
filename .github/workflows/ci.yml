name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Tailwind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        # postinstall 触发 `nuxt prepare`，生成 .nuxt（eslint config 依赖它）
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bunx eslint .

      - name: Tailwind lint
        run: bun run tailwindcss:lint

# 注：nuxi typecheck 未纳入 CI——Nuxt InternalApi 类型生成在不同环境下不忠实
# （本地通过、CI 干净环境会误报 'never'/undefined）。typecheck 以本地为准，
# 见 CONTRIBUTING.md 校验一节；贡献者在本地跑 `bunx nuxi typecheck`。
