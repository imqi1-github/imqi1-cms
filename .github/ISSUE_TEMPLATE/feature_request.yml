name: ✨ 功能建议
description: 提出一个新功能或改进方案
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想解决的问题，而不是直接甩一个实现——这有助于讨论更合适的方案。

  - type: textarea
    id: problem
    attributes:
      label: 现状 & 痛点
      description: 当前是什么状况？为什么你觉得需要改进？
      placeholder: 目前…，但不方便/不满足…，因为…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你设想中理想的做法（不限于一种）
      placeholder: 希望能…，大致思路是…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 还有哪些可接受的替代做法？
      placeholder: 如果 A 方案不合适，也可以接受 B…

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      description: 这个改动可能触及哪些端？（可多选）
      options:
        - label: Web 前台
        - label: 后台管理（/admin）
        - label: API / 服务端
        - label: 数据库（schema）
        - label: 小程序端（mini）
        - label: 部署 / 构建

  - type: input
    id: priority
    attributes:
      label: 优先级
      description: 你认为的重要程度与理由
      placeholder: 中——因为这会影响…（可选填）
