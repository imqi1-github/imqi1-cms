# 带 Redis 版本：应用 + MySQL 8 + Redis 7。宿主 .env 配置 REDIS_HOST_PROD（非空）即烘焙
# Redis 连接并启动 redis 容器；留空则应用不使用 Redis（容器仍会启动）。
# 运行：项目根目录执行 docker compose --env-file .env -f docker/docker-compose.yml up -d --build

# 固定项目名（默认取配置文件所在目录名），决定卷名前缀，两套文件保持一致。
name: imqi1-cms

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Redis 构建期烘焙（与下方 redis 服务同源）：REDIS_HOST_PROD 非空 → 烘焙 redis:6379。
        REDIS_HOST_PROD: ${REDIS_HOST_PROD:+redis}
        REDIS_PORT_PROD: ${REDIS_PORT_PROD:-6379}
        REDIS_PASSWORD_PROD: ${REDIS_PASSWORD_PROD:-}
        REDIS_DB_PROD: ${REDIS_DB_PROD:-0}
    image: imqi1-nodejs:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      # 运行时容器内不注入 Redis 变量（构建期已烘焙）；env_file 带入的 REDIS_*_PROD 进程不读取。
      DB_HOST: mysql
      DB_PORT: "3306"
      # 容器内上传目录固定；UPLOADS_DIR（.env）表示宿主演路径，见下方 volumes。
      UPLOADS_DIR: /app/.output/public/uploads
    env_file:
      - ../.env
    volumes:
      # 本地上传目录 bind mount：宿主 UPLOADS_DIR（默认项目根/uploads）→ 容器内 /app/.output/public/uploads
      - ${UPLOADS_DIR:-../uploads}:/app/.output/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: imqi1-mysql
    restart: unless-stopped
    environment:
      # root 与 nodejs 普通用户密码都用 DB_PASSWORD；应用与 healthcheck 只用 nodejs。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-imqi1}
      # ⚠️ 不能设为 root（MYSQL_USER 只用于创建普通用户，root 会报错起不来）
      MYSQL_USER: ${DB_USER:-nodejs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 卷为空时首次启动自动执行 init-db.sql（建表 + 默认数据）；卷已有数据则跳过。
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # 用应用账户探活，nodejs 就绪后才启动 app，避免启动初期 Access denied。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-nodejs}", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
