# 带 Redis 版本；参数用 --build-arg 覆盖，用法见 docker/README.md

# 固定项目名，决定卷名前缀；两套 compose 必须一致
name: imqi1-cms

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # 固定字面量：compose 不插值，避免 .env 里的同名变量混进构建；要改就用 --build-arg
        REDIS_ENABLED: "true"
        REDIS_HOST: "redis"
        REDIS_PORT: "6379"
        REDIS_DB: "0"
    image: imqi1-cms:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      # 运行时容器内不注入 Redis 变量（构建期已烘焙）
      DB_HOST: postgres
      DB_PORT: "5432"
      # 容器内路径固定；宿主路径见下方 volumes
      UPLOADS_DIR: /app/.output/public/uploads
      LOGS_DIR: /app/logs
    env_file:
      # .env 可选：不存在也能启动（变量都有默认值）
      - path: ../.env
        required: false
    volumes:
      # 宿主上传目录 → 容器内上传目录
      - ${UPLOADS_DIR:-../uploads}:/app/.output/public/uploads
      # 会话（sessionStoreType=file）；须具名卷否则重建容器掉登录态，属主靠 Dockerfile 的 chown node:node
      - sessions-data:/app/.sessions
      # 宿主日志目录 → 容器内日志目录（每类别一个子目录、按天分文件）；宿主目录须 node 用户（uid 1000）可写
      - ${LOGS_DIR:-../logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: imqi1-postgres
    restart: unless-stopped
    environment:
      # PG 单用户即超级用户（无 MySQL 那样的 root/普通用户分权）
      POSTGRES_USER: ${DB_USER:-imqi1}
      # 默认 123456 只为不配 .env 也能起来（PG 不接受空密码）；生产务必改掉
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-imqi1-cms}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 卷为空时首次启动自动建表 + 种子数据
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # pg_isready 无需密码，仅探测可连接
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-imqi1}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    # 仅 compose 内网可达（未发布端口），故不开鉴权
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
  sessions-data:
