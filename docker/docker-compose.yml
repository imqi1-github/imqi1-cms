# 带 Redis 版本：应用（Node）+ MySQL 8 + Redis 7
# 使用：在项目根目录执行
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
# 宿主 .env 配置了 REDIS_HOST_PROD（非空）即烘焙 Redis 连接并启动 redis 容器；
# 不需要 Redis 的部署请用 docker-compose.noredis.yml（见 docker/README.md）。
# 所有 ../ 相对路径均指项目根目录（compose 文件位于 docker/ 子目录）。

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # 传给 Dockerfile 用于动态预建 + chown 上传目录，与下方 environment / 卷挂载点同源。
        UPLOADS_DIR: ${UPLOADS_DIR:-/app/.output/public/uploads}
        # Redis 构建期烘焙（与下方 redis 服务同源）：宿主 .env 的 REDIS_HOST_PROD 非空
        # → 传 compose 服务名 redis（端口 6379、无密码，与内置 redis 容器一致）烘焙进产物，
        # ISR 与搜索缓存共用；留空 → 传空串，getRedisConfig() 返回 null，ISR 走文件系统、
        # 搜索缓存关闭（redis 容器仍会启动，只是应用不使用）。生产运行时容器内始终无 Redis 环境变量。
        REDIS_HOST_PROD: ${REDIS_HOST_PROD:+redis}
        REDIS_PORT_PROD: ${REDIS_PORT_PROD:-6379}
        REDIS_PASSWORD_PROD: ${REDIS_PASSWORD_PROD:-}
        REDIS_DB_PROD: ${REDIS_DB_PROD:-0}
    image: imqi1-nodejs:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      # 覆盖 .env 中的连接目标，指向 compose 内的服务名
      DB_HOST: mysql
      DB_PORT: "3306"
      # 本环境块不注入任何 Redis 环境变量：Redis 是构建期烘焙（见上方 build.args），
      # 运行时不再读取。注意 env_file 会把 .env 里的 REDIS_*_PROD 原样带进容器，
      # 但进程已不读取这些变量（惰性），无需处理。
      # 本地上传目录：应用运行时（getUploadsDir）与下方卷挂载点共用同一路径，
      # 保证不设也能对上默认的 .output/public/uploads。若在 .env/shell 中设置了
      # UPLOADS_DIR，二者会一起跟随，避免写入位置与持久化卷错配。
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/.output/public/uploads}
    env_file:
      - ../.env
    volumes:
      # 用户上传文件持久化（应用运行时写入）；挂载点跟随 UPLOADS_DIR。
      # 注意：若把 UPLOADS_DIR 指向 /app/.output/public/uploads 之外的路径，
      # 该路径在镜像中不存在时，具名卷首次挂载会以 root 属主创建，非 root 的
      # node 用户可能无法写入（EACCES）。此时需在 Dockerfile 预建该目录并
      # chown node:node，或改用已 chown 的路径。
      - uploads:${UPLOADS_DIR:-/app/.output/public/uploads}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: imqi1-mysql
    restart: unless-stopped
    environment:
      # root 密码：MySQL 镜像强制要求设置，且 root 账户无法物理删除。
      # 但应用连接与下方 healthcheck 全部使用 nodejs，root 仅存在、不被使用。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-imqi1}
      # 首次初始化（数据卷为空）时自动创建 nodejs 用户，并授予 MYSQL_DATABASE 全部权限。
      # 官方镜像仅在首次初始化时执行这些变量；已存在的卷不会重建用户。
      MYSQL_USER: ${DB_USER:-nodejs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库自动初始化：MySQL 官方镜像会在「数据目录为空」（即首次创建）时，
      # 自动按文件名顺序执行 /docker-entrypoint-initdb.d/ 下的 .sql，且默认库为
      # MYSQL_DATABASE（DB_NAME）。init-db.sql 只建表/插数据、不含库名，正好导入该库。
      # 因此首次 `docker compose up` 即完成建表 + 默认设置 + 示例数据，无需再手动初始化。
      # 注意：仅当 mysql-data 卷为空时才会执行；卷已有数据则跳过（不会覆盖已有数据）。
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # 用 nodejs 应用账户探活：只有当 nodejs 用户初始化完成后才判定 healthy，
      # app 因此会等到用户就绪再启动，避免启动初期的 Access denied。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-nodejs}", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis（带 Redis 版本）：端口固定 6379、无密码（与上方 build.args 烘焙的连接一致），
  # 数据存于 redis-data 卷。
  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  uploads:
