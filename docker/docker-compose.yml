# 带 Redis 版本：应用 + PostgreSQL + Redis 7。宿主 .env 配置 REDIS_HOST_PROD（非空）即烘焙
# Redis 连接并启动 redis 容器；留空则应用不使用 Redis（容器仍会启动）。
# 运行：项目根目录执行 docker compose --env-file .env -f docker/docker-compose.yml up -d --build

# 固定项目名（默认取配置文件所在目录名），决定卷名前缀，两套文件保持一致。
name: imqi1-cms

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Redis 构建期烘焙（与下方 redis 服务同源）：REDIS_HOST_PROD 非空 → 烘焙 redis:6379。
        REDIS_HOST_PROD: ${REDIS_HOST_PROD:+redis}
        REDIS_PORT_PROD: ${REDIS_PORT_PROD:-6379}
        REDIS_PASSWORD_PROD: ${REDIS_PASSWORD_PROD:-}
        REDIS_DB_PROD: ${REDIS_DB_PROD:-0}
    image: imqi1-cms:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      # 运行时容器内不注入 Redis 变量（构建期已烘焙）；env_file 带入的 REDIS_*_PROD 进程不读取。
      DB_HOST: postgres
      DB_PORT: "5432"
      # 容器内上传目录固定；UPLOADS_DIR（.env）表示宿主演路径，见下方 volumes。
      UPLOADS_DIR: /app/.output/public/uploads
    env_file:
      - ../.env
    volumes:
      # 本地上传目录 bind mount：宿主 UPLOADS_DIR（默认项目根/uploads）→ 容器内 /app/.output/public/uploads
      - ${UPLOADS_DIR:-../uploads}:/app/.output/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: imqi1-postgres
    restart: unless-stopped
    environment:
      # 单用户即超级用户；应用与 healthcheck 均用 DB_USER（PG 无 MySQL 的 root/普通用户分权）。
      POSTGRES_USER: ${DB_USER:-imqi1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-imqi1-cms}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 卷为空时首次启动自动执行 init-db.sql（建表 + 默认数据）；卷已有数据则跳过。
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # pg_isready 无需密码，仅探测服务可接受连接；就绪后才启动 app。
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-imqi1}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD_PROD:-}"]
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
