# 不带 Redis 版本：应用 + MySQL 8，ISR 走文件系统缓存、搜索缓存关闭，无 redis 容器/卷。
# 运行：项目根目录执行 docker compose --env-file .env -f docker/docker-compose.noredis.yml up -d --build

# 固定项目名（默认取配置文件所在目录名），决定卷名前缀，两套文件保持一致。
name: imqi1-cms

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.noredis
      args:
        # 预建 + chown 上传目录，与下方 environment / 卷挂载点同源。
        UPLOADS_DIR: ${UPLOADS_DIR:-/app/.output/public/uploads}
    image: imqi1-nodejs:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/.output/public/uploads}
    env_file:
      - ../.env
    volumes:
      # 用户上传文件持久化；挂载点跟随 UPLOADS_DIR。
      - uploads:${UPLOADS_DIR:-/app/.output/public/uploads}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: imqi1-mysql
    restart: unless-stopped
    environment:
      # root 与 nodejs 普通用户密码都用 DB_PASSWORD；应用与 healthcheck 只用 nodejs。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-imqi1}
      # ⚠️ 不能设为 root（MYSQL_USER 只用于创建普通用户，root 会报错起不来）
      MYSQL_USER: ${DB_USER:-nodejs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 卷为空时首次启动自动执行 init-db.sql（建表 + 默认数据）；卷已有数据则跳过。
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # 用应用账户探活，nodejs 就绪后才启动 app，避免启动初期 Access denied。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-nodejs}", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  uploads:
